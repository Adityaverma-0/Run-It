services:
  - type: web
    name: sanket-distribution
    runtime: node
    plan: free
    branch: main
    rootDir: distribution
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_SETUP_TOKEN
        generateValue: true
